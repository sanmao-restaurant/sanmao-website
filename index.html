<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANMAO - Restaurant</title>
  <link rel="stylesheet" href="style.css?v=190">
</head>
<body>

  <!-- En-tête -->
  <header class="top-bar">
    <div class="logo">SANMAO三毛</div>

    <div class="social-center">
      <a href="https://www.instagram.com/sanmao.belleville/" target="_blank" class="social-icon" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <a href="https://www.xiaohongshu.com/user/profile/5f689a56000000000101f3ac" target="_blank" class="social-icon" aria-label="Xiaohongshu RED">
        <img src="photos/red-logo.png" alt="Xiaohongshu RED" class="red-icon" width="22" height="22">
      </a>
    </div>

    <div class="nav-right">
      <a href="https://mylightspeed.app/reservation/848e14a9-9a1b-45f6-b007-001f47996bc8/reservation" target="_blank" class="btn-reservation">RÉSERVATION</a>
    </div>
  </header>

  <!-- Zone principale -->
  <main class="hero-wrapper" id="hero-bg">
    <div class="btn-container">
      <button id="btn-open-menu" class="btn-menu-center">MENU</button>
      <button id="btn-open-menu-cn" class="btn-menu-center btn-cn">菜单</button>
    </div>
  </main>

  <!-- Pop-up Menu FR -->
  <div id="menu-modal" class="menu-modal">
    <div class="menu-card">
      <button id="btn-close-menu" class="close-card" aria-label="Fermer le menu">&times;</button>
      <div id="menu-content"></div>
    </div>
  </div>

  <!-- Pop-up Menu CN -->
  <div id="menu-modal-cn" class="menu-modal">
    <div class="menu-card">
      <button id="btn-close-menu-cn" class="close-card" aria-label="Fermer le menu">&times;</button>
      <div id="menu-content-cn"></div>
    </div>
  </div>

  <!-- Pied de page -->
  <footer class="footer-info">
    <span>64 rue Rébeval, 75019 Paris</span>
    <span class="separator">•</span>
    <span>Mar - Sam : 19h00 - 00h00</span>
    <span class="separator">•</span>
    <span><a href="tel:+33142410165">01 42 41 01 65</a></span>
  </footer>

  <script src="script.js?v=190"></script>
</body>
</html>
