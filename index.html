<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANMAO - Restaurant</title>
  <link rel="stylesheet" href="style.css?v=103">
</head>
<body>

  <!-- En-tête avec disposition : Logo à gauche | Instagram au centre | Réservation à droite -->
  <header class="top-bar">
    <div class="logo">SANMAO</div>

    <a href="https://www.instagram.com/sanmao.belleville/" target="_blank" class="insta-center" aria-label="Instagram">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    </a>

    <div class="nav-right">
      <a href="#booking" class="btn-reservation">RÉSERVATION</a>
    </div>
  </header>

  <!-- Conteneur principal : Fond image + carte texte superposée -->
  <main class="hero-wrapper" id="hero-bg">
    <div class="menu-card">
      <div id="menu-content">
        <!-- Le texte du menu chargé via script.js s'affiche ici -->
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
