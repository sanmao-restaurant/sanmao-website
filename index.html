<!DOCTYPE html>
<html lang="fr">
<head>

  <title>SANMAO - Restaurant</title>
  <link rel="stylesheet" href="style.css?v=102">
</head>
<body>

  <!-- Navigation / Header -->
  <header class="navbar">

    <div class="nav-right">

        <span class="active">FR</span> / <span>EN</span> / <span>ZH</span>
      </div>
      <a href="https://www.instagram.com/sanmao.belleville/" target="_blank" class="social-link" aria-label="Instagram">

          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>

    </div>

  <!-- Section Principale / Menu -->
  <main class="container">
    <div id="menu-content">
      <!-- Le menu est chargé dynamiquement via script.js -->
    </div>
  </main>

  <script src="script.js"></script>

</html>
